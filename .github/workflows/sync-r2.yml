name: Sync to R2

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A push whose run is superseded while it waits in the concurrency group
    # never gets its range uploaded, so a full sync runs weekly to catch up.
    - cron: '17 4 * * 1'

concurrency:
  group: sync-r2
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  BUCKET: ${{ secrets.R2_BUCKET }}
  VERSION_CACHE_CONTROL: 'public, max-age=86400, stale-while-revalidate=604800'
  INDEX_CACHE_CONTROL: 'public, max-age=300'
  # A history is rewritten whenever the version it ends at is released, so it
  # cannot be cached the way a version's own files are.
  HISTORY_CACHE_CONTROL: 'public, max-age=300'

jobs:
  sync:
    name: Sync archive to R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The upload is driven by the diff of the pushed range.
          fetch-depth: 0

      - name: Decide what to upload
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          # Only a push knows a range to upload; a manual run and the weekly
          # one exist to put the whole archive up.
          FULL: ${{ github.event_name != 'push' }}
        run: |
          set -euo pipefail

          if [ "$FULL" = 'true' ] ||
             [ "${BEFORE:-}" = '0000000000000000000000000000000000000000' ] ||
             ! git cat-file -e "${BEFORE:-missing}^{commit}" 2>/dev/null; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'full=false' >> "$GITHUB_OUTPUT"
          git diff --no-renames --diff-filter=d --name-only "$BEFORE" HEAD > changed.txt
          git diff --no-renames --diff-filter=D --name-only "$BEFORE" HEAD > deleted.txt

      # aws s3 sync compares size and mtime, and a checkout gives every file a
      # fresh mtime, so this re-uploads everything. That is what a full sync is
      # for; the incremental path below is what a release takes.
      - name: Upload everything
        if: steps.plan.outputs.full == 'true'
        run: |
          set -euo pipefail
          aws s3 sync v "s3://$BUCKET/v" \
            --endpoint-url "$ENDPOINT" \
            --cache-control "$VERSION_CACHE_CONTROL" \
            --delete
          aws s3 sync history "s3://$BUCKET/history" \
            --endpoint-url "$ENDPOINT" \
            --cache-control "$HISTORY_CACHE_CONTROL" \
            --delete
          aws s3 cp index.json "s3://$BUCKET/index.json" \
            --endpoint-url "$ENDPOINT" \
            --cache-control "$INDEX_CACHE_CONTROL"

      - name: Upload what the push changed
        if: steps.plan.outputs.full == 'false'
        run: |
          set -euo pipefail

          upload() {
            aws s3 cp "$1" "s3://$BUCKET/$1" \
              --endpoint-url "$ENDPOINT" \
              --cache-control "$2" </dev/null
          }

          while IFS= read -r file; do
            case "$file" in
              v/*) upload "$file" "$VERSION_CACHE_CONTROL" ;;
              history/*) upload "$file" "$HISTORY_CACHE_CONTROL" ;;
              index.json) upload "$file" "$INDEX_CACHE_CONTROL" ;;
              README.md|cors.json|.github/*) ;;
              # An unrecognised path means the layout moved and this workflow
              # did not follow; failing is better than silently not uploading.
              *) echo "unexpected path: $file" >&2; exit 1 ;;
            esac
          done < changed.txt

          while IFS= read -r file; do
            case "$file" in
              v/*|history/*|index.json)
                aws s3 rm "s3://$BUCKET/$file" --endpoint-url "$ENDPOINT" </dev/null ;;
              README.md|cors.json|.github/*) ;;
              *) echo "unexpected path: $file" >&2; exit 1 ;;
            esac
          done < deleted.txt
